[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "choques"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "requests==2.34.2", "pandas==3.1.1", "pyarrow==26.0.1",
  "numpy==2.5.5", "scipy==1.18.1", "pyfixest==0.70.0", "matplotlib==3.11.2",
]

[tool.setuptools.packages.find]
where = ["src"]
